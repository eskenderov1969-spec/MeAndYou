<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fb;--card:#fff;--cell:#eceaf6;--track:#e4e1f1;--text:#2a2650;--mute:#857fa6;--gold:#fde7a6;--goldd:#f1b93a;--goldtxt:#7a5a10;--okc:#2f8f68;--c0:#7c9cf5;--c1:#b58cf0;--c2:#f5a56b;--c3:#4fc8b0;--c4:#5bb8f0;--acc:#6f9cf0;--shadow:0 10px 30px rgba(60,50,130,.10);--fd:"Unbounded","Manrope",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132b;--card:#201d3d;--cell:#2a2650;--track:#34305c;--text:#ebe9fb;--mute:#9a94c2;--gold:#5c4a1e;--goldtxt:#ffe3a0;--okc:#7fe0b6;--shadow:0 10px 30px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#15132b;--card:#201d3d;--cell:#2a2650;--track:#34305c;--text:#ebe9fb;--mute:#9a94c2;--gold:#5c4a1e;--goldtxt:#ffe3a0;--okc:#7fe0b6;--shadow:0 10px 30px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:color-mix(in srgb,var(--acc) 10%,var(--bg));color:var(--text);font-family:"Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .5s;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 44px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:30px;padding:20px;box-shadow:var(--shadow)}
.lbl{font-size:13px;font-weight:700;color:var(--mute)}
.seg{display:flex;background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:99px;padding:4px}
.seg button{flex:1;height:36px;border-radius:99px;background:none;font-weight:700;font-size:14px;color:var(--mute);transition:all .25s}

.top{display:flex;align-items:center;justify-content:space-between}

.hero{display:flex;flex-direction:column;gap:6px;align-items:center}
.twin{width:100%;max-width:340px;height:auto;display:block;overflow:visible}
.rp{font:600 22px var(--fd);fill:var(--text)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}

.d{aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;font-size:13px;font-weight:600;background:conic-gradient(var(--acc) var(--p,0%),var(--track) 0);transition:transform .15s}
.d::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card)}

.d:active{transform:scale(.92)}
.d.e{visibility:hidden}
.d.full{background:var(--goldd)}
.d.full::before{background:var(--gold)}
.d.full span{color:var(--goldtxt);font-weight:700}
.d.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.d.today span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.dayhead small{color:var(--mute);display:block;margin-top:4px;font-size:13px;font-weight:600}
.ringbox{position:relative;flex:none}
.ringbox svg{display:block}
.ringbox b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 12px var(--fd)}
.h{background:color-mix(in srgb,var(--hc) 13%,var(--card));border-radius:24px;padding:14px;margin-bottom:10px}
.h:last-child{margin-bottom:0}
.hd{display:flex;align-items:center;gap:12px}
.ic{width:40px;height:40px;border-radius:14px;background:var(--hc);display:grid;place-items:center;color:#fff;flex:none}

.ht{display:flex;flex-direction:column;gap:2px}

.ht small{color:var(--mute);font-size:12px;font-weight:600}

.ctl{display:flex;align-items:center;gap:8px}

.ctl button:active{transform:scale(.9)}
.ctl input,.gl input{flex:1;min-width:0;height:42px;border-radius:16px;border:0;background:var(--card);color:var(--text);text-align:center;font:600 16px var(--fd);outline-offset:2px}
.ctl span{color:var(--mute);font-size:12px;width:40px;font-weight:600}
.stats{display:flex;flex-direction:column;gap:12px;padding:0 4px}
.stat{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.stat span{width:84px}
.stat .bar{flex:1;margin:0}
.stat em{font-style:normal;width:40px;text-align:right;color:var(--mute)}
.link{background:none;color:var(--mute);font-size:13px;font-weight:600;padding:6px 0;text-align:center}
.gl{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;margin-top:12px;font-size:14px;font-weight:600}
.d.ty::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--c4)}
.wk{display:flex;gap:6px;margin:12px 0 0;justify-content:space-between}
.wk i{flex:1;max-width:38px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 11px "Manrope",sans-serif;font-style:normal;background:color-mix(in srgb,var(--hc) 16%,var(--track));color:var(--mute)}

.tg.on{background:var(--hc);color:#fff}
.wkt{display:block;text-align:center;margin-top:8px;color:var(--mute);font-weight:600;font-size:12px}
.wide{max-width:1240px}
.wide .seg,.wide .top,.wide .who,.wide .note{max-width:480px;margin-left:auto;margin-right:auto;width:100%}
.tw{overflow-x:auto;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:8px 0 12px}

.pl th small{font-size:10px;font-weight:600}
.pl th.we b{color:#d9788c}
.pl th.td b{background:var(--acc);color:#fff}
.pl td.mo,.pl th.mo{border-left:1px solid color-mix(in srgb,var(--text) 10%,transparent)}
.pl td.we{background:color-mix(in srgb,var(--text) 3.5%,transparent)}
.rl{display:flex;align-items:center;gap:10px}
.pl .ic{width:30px;height:30px;border-radius:10px}
.pl .ic svg{width:16px;height:16px}
.pl .ht b{font-size:13px}
.pl .ht small{font-size:11px}
.c{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin:auto;font-size:13px;font-weight:800;color:#fff;background:color-mix(in srgb,var(--hc,var(--text)) 13%,var(--track));transition:transform .12s}
.c:active{transform:scale(.88)}
.c.met{background:var(--hc)}
.c.part{background:color-mix(in srgb,var(--hc) 38%,var(--card));color:var(--hc)}
.c.dp{font:600 10px var(--fd);color:var(--text);background:color-mix(in srgb,var(--acc) calc(var(--a)*1%),var(--track))}
.c.dp.gold{background:var(--goldd);color:#fff}
.tot{min-width:96px;padding:3px 12px 3px 8px}
.tot b{display:block;font:600 13px var(--fd)}
.tot small{font-size:11px;color:var(--mute);font-weight:600}
.pl tr.sum td{padding-top:10px}
@media(max-width:560px){.pl .sk{min-width:112px;padding:5px 8px 5px 10px}.pl .ht small{display:none}.pl .rl{gap:8px}.pl .ht b{font-size:12.5px;white-space:normal;line-height:1.2}}
.sbg{position:fixed;inset:0;background:rgba(30,25,70,.38);z-index:40;border-radius:0;animation:fd .2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-radius:30px 30px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:41;box-shadow:0 -10px 40px rgba(30,25,70,.25);animation:up .28s cubic-bezier(.3,.8,.3,1)}
.sheet h3{margin:0 0 4px;font:600 18px var(--fd)}
.sheet small{display:block;color:var(--mute);font-weight:600;font-size:13px}
.sheet .ctl{margin:18px 0 12px}
.sheet .ctl input{background:var(--cell)}
.sheet .ctl button{background:var(--cell);box-shadow:none}
.acts{display:flex;gap:8px}
.acts button,.sheet .done{flex:1;height:48px;border-radius:16px;font-weight:700;font-size:14px;background:var(--cell)}
.acts .pri{background:var(--hc);color:#fff}
.sheet .done{width:100%;margin-top:8px;background:var(--text);color:var(--card)}
.mode button{font-size:13px}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translate(-50%,50px);opacity:0}}
.sync{text-align:center;color:var(--mute);font-size:12px}
.duo{display:flex;gap:10px}
.mini{flex:1;border-radius:22px;background:var(--cell);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.tabs{margin-bottom:-4px}
.hr{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.hdt{display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 16px var(--fd)}
.hdt small{color:var(--mute);font:600 11px "Manrope",sans-serif}
.hc{background:var(--card);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.hc.full{background:var(--gold);color:var(--goldtxt)}
.hc b{font:600 14px var(--fd)}
.hc span{display:flex;gap:6px;font-size:11px;font-weight:600}
.hc u{text-decoration:none;color:var(--mute)}
.hc u.ok{color:var(--okc)}
.hc i{font-size:11px;color:var(--mute);font-style:normal;padding:8px 0}
.hn{display:flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--fd)}
.dot{width:10px;height:10px;border-radius:50%}
.note{font-size:12px;color:var(--mute);text-align:center;margin:4px 0 12px;font-weight:600}
.cf{position:fixed;left:50%;top:36%;width:8px;height:12px;border-radius:3px;pointer-events:none;z-index:50;animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.cf{display:none}}
</style>

<body>
<div class="wrap" id="app"></div>
<script>
const H=[{n:'Английский язык',u:'ч',g:1.5,s:.5},{n:'Чтение книги',u:'ч',g:1,s:.5},{n:'Ходьба',u:'шагов',g:8000,s:1000},{n:'Сон (минимум)',u:'ч',g:7,s:.5}];
const PEOPLE=[{id:'emir',n:'Эмир',acc:'#8fb4ec',deep:'#4a82f0'},{id:'saida',n:'Саида',acc:'#f0a9c6',deep:'#ea5a90'}];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const LS='habits-v2';
const fresh=()=>({goals:H.map(h=>h.g),days:{}});
let P={emir:fresh(),saida:fresh()},who='emir',S,showGoals=false,view='table',mode='quick',sheet=null,tblReset=true,syncMsg='Подключение…',refs=null;
try{const t=JSON.parse(localStorage.getItem(LS));if(t){for(const p of PEOPLE)if(t.P&&t.P[p.id]&&t.P[p.id].days)P[p.id]={goals:t.P[p.id].goals||P[p.id].goals,days:t.P[p.id].days};if(t.who&&P[t.who])who=t.who}}catch(e){}
S=P[who];
const now=new Date();let vy=now.getFullYear(),vm=now.getMonth();
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const todayK=()=>key(now.getFullYear(),now.getMonth(),now.getDate());
let sel=todayK();
const num=n=>String(n).replace('.',',');
const big=n=>Number(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const gfmt=i=>H[i].u==='шагов'?big(S.goals[i]):num(S.goals[i]);
function pctOf(D,k){const v=(D.days[k]||[]).slice(0,4);if(!v.length||v.every(x=>x==null))return null;return v.reduce((a,x,i)=>a+(x!=null&&x>=D.goals[i]?1:0),0)/4}
function monthOf(D){const nd=new Date(vy,vm+1,0).getDate();let sum=0,cnt=0,full=0,ty=0;const hd=[0,0,0,0];
for(let d=1;d<=nd;d++){const k=key(vy,vm,d),p=pctOf(D,k);if((D.days[k]||[])[4]===1)ty++;if(p!=null){sum+=p;cnt++;if(p===1)full++;D.days[k].slice(0,4).forEach((x,i)=>{if(x!=null&&x>=D.goals[i])hd[i]++})}}
return{nd,cnt,full,hd,ty,mp:cnt?sum/cnt:0}}
function ring(p,sz,sw,col){const r=(sz-sw)/2,c=2*Math.PI*r,m=sz/2;
return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>${p>0?`<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,1)} ${c}" transform="rotate(-90 ${m} ${m})"/>`:''}</svg>`}
const CFG={url:'https://qffmezdmqmsvunmnzowl.supabase.co',key:'sb_publishable_vovS9yfPQIOAs1xRpLWcRg_rhQgFeMC'};
try{const h=decodeURIComponent(location.hash.slice(1));if(h){localStorage.setItem('habits-code',h);history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
let CODE='';try{CODE=localStorage.getItem('habits-code')||''}catch(e){}
let remote=!!(CFG.url&&CFG.key&&CODE);const dirty={},tms={};
async function rpc(fn,body){const r=await fetch(CFG.url.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:CFG.key},CFG.key.startsWith('sb_')?{}:{Authorization:'Bearer '+CFG.key}),body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
const setSync=m=>{syncMsg=m;const e=document.querySelector('.sync');if(e)e.textContent=m};
function push(w){clearTimeout(tms[w]);tms[w]=setTimeout(async()=>{try{await rpc('save_tracker',{p_code:CODE+':'+w,p_data:{goals:P[w].goals,days:P[w].days}});delete dirty[w];setSync('Синхронизировано ✓')}catch(e){setSync('Нет связи — сохранено на устройстве, отправится позже')}},500)}
function save(w=who){try{localStorage.setItem(LS,JSON.stringify({P,who}))}catch(e){}
if(remote){dirty[w]=1;push(w)}}
async function pull(){if(!remote)return;let changed=false;
try{for(const p of PEOPLE){const r=await rpc('get_tracker',{p_code:CODE+':'+p.id});
if(dirty[p.id]){push(p.id);continue}
if(r&&r.days){const n={goals:r.goals||P[p.id].goals,days:r.days};if(JSON.stringify(n)!==JSON.stringify(P[p.id])){P[p.id]=n;changed=true}}
else if(Object.keys(P[p.id].days).length){dirty[p.id]=1;push(p.id)}}
S=P[who];if(changed){try{localStorage.setItem(LS,JSON.stringify({P,who}))}catch(e){}
if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()}
setSync('Синхронизировано ✓')}catch(e){setSync('Нет связи — данные на этом устройстве')}}
function setVal(k,i,v){const was=pctOf(S,k);if(!S.days[k])S.days[k]=[null,null,null,null,null];S.days[k][i]=v;if(pctOf(S,k)===1&&was!==1)setTimeout(burst,80);if(S.days[k].every(x=>x==null))delete S.days[k];save();render()}
const ICONS=['<path d="M4 5h16v11H9l-5 4z"/>','<path d="M4 5.5C6 4 9 4 12 6c3-2 6-2 8-.5V19c-2-1.5-5-1.5-8 .5-3-2-6-2-8-.5z"/><path d="M12 6v13.5"/>','<ellipse cx="8.5" cy="9" rx="3" ry="4.5"/><ellipse cx="15.5" cy="15" rx="3" ry="4.5"/>','<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'];
const tabs=()=>`<div class="seg tabs">${[['table','Планер'],['track','День'],['hist','История']].map(([v,t])=>`<button data-v="${v}" class="${view===v?'on':''}">${t}</button>`).join('')}</div>`;
const short=(i,x)=>H[i].u==='шагов'?(x>=1000?(x/1000).toFixed(1).replace('.',',').replace(',0','')+'к':String(x)):num(x);
function arc(cx,cy,r,sw,p,col,op){const c=2*Math.PI*r;return `<g opacity="${op}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>${p>0?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,1)} ${c}" transform="rotate(-90 ${cx} ${cy})"/>`:''}</g>`}
function burst(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const cols=['#7c9cf5','#f08fb0','#f1b93a','#4fc8b0','#b58cf0'];
for(let i=0;i<26;i++){const e=document.createElement('div');e.className='cf';const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
e.style.cssText=`background:${cols[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+60}px;--r:${Math.random()*540-270}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}
const KB='<rect x="3" y="7" width="18" height="11" rx="2.5"/><path d="M7 11h.01M11 11h.01M15 11h.01M8 15h8"/>';
const wg=D=>D.goals[4]||3;
const raz=n=>[2,3,4].includes(n)?'раза':'раз';
function weekKeys(k){const a=k.split('-').map(Number),dt=new Date(a[0],a[1]-1,a[2]),mon=(dt.getDay()+6)%7;
return Array.from({length:7},(_,j)=>{const x=new Date(a[0],a[1]-1,a[2]-mon+j);return key(x.getFullYear(),x.getMonth(),x.getDate())})}
function typingTile(){const wk=weekKeys(sel),isOn=k=>(S.days[k]||[])[4]===1,wc=wk.filter(isOn).length,tg=wg(S),done=isOn(sel);
return `<div class="h" style="--hc:var(--c4)"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24">${KB}</svg></span><div class="ht"><b>Учиться печатать</b><small>цель ${tg} ${raz(tg)} в неделю</small></div><span class="ok">${wc>=tg?'✓':''}</span></div>
<div class="wk">${wk.map((k,j)=>`<i class="${isOn(k)?'on':''} ${k===sel?'cur':''}">${['П','В','С','Ч','П','С','В'][j]}</i>`).join('')}</div>
<button class="tg ${done?'on':''}" data-ty="1">${done?'Занятие отмечено ✓':'Отметить занятие'}</button><span class="wkt">За неделю: ${wc} из ${tg}</span></div>`}
function tyStat(M){const tg=wg(S),p=Math.min(1,M.ty/(tg*M.nd/7));
return `<div class="stat"><span>Печать</span><div class="bar" style="--hc:var(--c4)"><i style="width:${p*100}%;background:var(--c4)"></i></div><em>${Math.round(p*100)}%</em></div>`}
function cellTap(k,i){const cur=(S.days[k]||[])[i];
if(i===4)return setVal(k,4,cur===1?null:1);
if(mode==='exact'){sheet={k,i};render();return}
setVal(k,i,(cur!=null&&cur>=S.goals[i])?null:S.goals[i])}
function sheetHtml(){if(!sheet)return '';const{k,i}=sheet,h=H[i],v=(S.days[k]||[])[i],a=k.split('-').map(Number);
return `<button class="sbg" data-sd="1" aria-label="Закрыть"></button><div class="sheet" style="--hc:var(--c${i})"><h3>${h.n}</h3><small>${a[2]} ${MG[a[1]-1]}, цель ${gfmt(i)} ${h.u}</small>
<div class="ctl"><button data-sa="-1" aria-label="Меньше">−</button><input type="number" inputmode="decimal" step="any" min="0" placeholder="0" data-si="${i}" value="${v==null?'':v}" aria-label="${h.n}"><span>${h.u}</span><button data-sa="1" aria-label="Больше">+</button></div>
<div class="acts"><button class="pri" data-sg="1">Цель выполнена</button><button data-sc="1">Очистить</button></div><button class="done" data-sd="1">Готово</button></div>`}
function renderTable(){
const oldTw=document.querySelector('.tw'),keep=(oldTw&&!tblReset)?oldTw.scrollLeft:null;tblReset=false;
const D=S,M=monthOf(D),{nd,cnt,full,hd,mp,ty}=M,dn=['вс','пн','вт','ср','чт','пт','сб'],tk=todayK(),tg=wg(D);
const mo=PEOPLE.map(p=>monthOf(P[p.id]));
const who_=`<div class="who">${PEOPLE.map((p,ix)=>`<button class="${p.id===who?'on':''}" data-w="${p.id}" style="--pc:${p.acc};--pd:${p.deep}"><b>${p.n}</b><small>${Math.round(mo[ix].mp*100)}% · ${mo[ix].full} дн. со 100%</small></button>`).join('')}</div>`;
const cl=d=>{const wd=new Date(vy,vm,d).getDay();return (wd===0||wd===6?'we ':'')+(wd===1&&d>1?'mo':'')};
let ths='';for(let d=1;d<=nd;d++){const wd=new Date(vy,vm,d).getDay();ths+=`<th class="${cl(d)}"><b class="${key(vy,vm,d)===tk?'td':''}">${d}</b><small>${dn[wd]}</small></th>`}
const names=['Английский язык','Чтение книги','Ходьба','Сон (минимум)','Учиться печатать'];
let body='';
for(let i=0;i<5;i++){
const goalT=i<4?`${gfmt(i)} ${H[i].u}`:`${tg} ${raz(tg)} в неделю`;
let tds='';
for(let d=1;d<=nd;d++){const k=key(vy,vm,d),v=(D.days[k]||[])[i];let c='c',t='';
if(i<4){if(v!=null){if(v>=D.goals[i]){c+=' met';t='✓'}else{c+=' part';t='•'}}}else if(v===1){c+=' met';t='✓'}
tds+=`<td class="${cl(d)}"><button class="${c}" data-ck="${k}" data-ci="${i}" aria-label="${names[i]}, ${d}">${t}</button></td>`}
let tot;if(i<4){const pp=cnt?hd[i]/cnt:0;tot=`<b>${Math.round(pp*100)}%</b><small>${hd[i]} из ${cnt}</small>`}
else{const pp=Math.min(1,ty/(tg*nd/7));tot=`<b>${Math.round(pp*100)}%</b><small>${ty} ${raz(ty)}</small>`}
body+=`<tr style="--hc:var(--c${i})"><td class="sk"><div class="rl"><span class="ic"><svg viewBox="0 0 24 24">${i<4?ICONS[i]:KB}</svg></span><div class="ht"><b>${names[i]}</b><small>${goalT}</small></div></div></td>${tds}<td class="tot">${tot}</td></tr>`}
let dtd='';for(let d=1;d<=nd;d++){const k=key(vy,vm,d),pc=pctOf(D,k);
dtd+=`<td class="${cl(d)}">${pc==null?'<button class="c" data-hw="'+who+'" data-hk="'+k+'" style="--hc:var(--mute)"></button>':`<button class="c dp ${pc===1?'gold':''}" style="--a:${Math.round(pc*100)}" data-hw="${who}" data-hk="${k}">${Math.round(pc*100)}</button>`}</td>`}
body+=`<tr class="sum"><td class="sk"><div class="rl"><div class="ht"><b>Прогресс дня</b><small>четыре ежедневные привычки</small></div></div></td>${dtd}<td class="tot"><b>${Math.round(mp*100)}%</b><small>${full} дн. со 100%</small></td></tr>`;
document.getElementById('app').innerHTML=`${tabs()}
<div class="top"><button class="nav" data-m="-1" aria-label="Предыдущий месяц">‹</button><h1>${MN[vm]} ${vy}</h1><button class="nav" data-m="1" aria-label="Следующий месяц">›</button></div>
${who_}
<div class="seg tabs mode"><button data-md="quick" class="${mode==='quick'?'on':''}">Быстрая отметка</button><button data-md="exact" class="${mode==='exact'?'on':''}">Точные значения</button></div>
<div class="tw"><table class="pl"><thead><tr><th class="sk"></th>${ths}<th class="tot">Итог</th></tr></thead><tbody>${body}</tbody></table></div>
<div class="note">${mode==='quick'?'Нажми на клетку, чтобы отметить привычку выполненной. Нажми ещё раз, чтобы снять отметку.':'Нажми на клетку, чтобы ввести точное значение.'} Печать отмечается одним нажатием. Нажми на процент внизу, чтобы открыть день.</div>
<div class="sync">${syncMsg}</div>${sheetHtml()}`;
const tw=document.querySelector('.tw');if(tw&&keep!=null)tw.scrollLeft=keep;else if(tw&&vy===now.getFullYear()&&vm===now.getMonth()){const cw=tw.clientWidth,lw=cw<700?112:152;tw.scrollLeft=cw<700?Math.max(0,(now.getDate()-4)*36):Math.max(0,lw+now.getDate()*36+40-cw)}}
function renderHist(){
const nd=new Date(vy,vm+1,0).getDate(),last=new Date(vy,vm,1)>now?0:(vy===now.getFullYear()&&vm===now.getMonth()?now.getDate():nd);
const DW=['вс','пн','вт','ср','чт','пт','сб'];
const cell=(p,k)=>{const D=P[p.id],v=D.days[k],pc=pctOf(D,k);
if(pc==null)return `<button class="hc" data-hw="${p.id}" data-hk="${k}"><i>нет данных</i></button>`;
return `<button class="hc ${pc===1?'full':''}" data-hw="${p.id}" data-hk="${k}"><b>${Math.round(pc*100)}%${pc===1?' ✓':''}</b><span>${v.slice(0,4).map((x,i)=>x==null?'<u>–</u>':`<u class="${x>=D.goals[i]?'ok':''}">${short(i,x)}</u>`).join('')}${v[4]===1?'<u class="ok">⌨</u>':''}</span></button>`};
let rows='';for(let d=last;d>=1;d--){const k=key(vy,vm,d);
rows+=`<div class="hr"><div class="hdt"><b>${d}</b><small>${DW[new Date(vy,vm,d).getDay()]}</small></div>${PEOPLE.map(p=>cell(p,k)).join('')}</div>`}
const sum=PEOPLE.map(p=>{const m=monthOf(P[p.id]);return `<div class="mini"><div class="ringbox" style="width:64px;height:64px">${ring(m.mp,64,8,p.acc)}<b>${Math.round(m.mp*100)}%</b></div><span>${p.n}: ${m.full} дн. со 100%</span></div>`}).join('');
document.getElementById('app').innerHTML=`${tabs()}
<div class="top"><button class="nav" data-m="-1">‹</button><h1>${MN[vm]} ${vy}</h1><button class="nav" data-m="1">›</button></div>
<div class="card"><span class="lbl" style="display:block;margin-bottom:12px">Итоги месяца</span><div class="duo">${sum}</div></div>
<div><div class="hr"><div></div>${PEOPLE.map(p=>`<div class="hn"><span class="dot" style="background:${p.acc}"></span>${p.n}</div>`).join('')}</div>
<div class="note">Порядок: английский, чтение, шаги, сон. Зелёным выделена выполненная цель. Нажми на день, чтобы открыть его в планере.</div>
${rows||'<div class="note">В этом месяце ещё нет дней</div>'}</div>
<div class="sync">${syncMsg}</div>`}
function render(){
if(!CODE){document.getElementById('app').innerHTML='<div class="card" style="margin-top:18vh;text-align:center"><h2 style="margin:0 0 6px;font-size:19px">Планер</h2><p style="color:var(--mute);font-size:14px;margin:0">Введите код доступа — один раз на этом устройстве</p><div class="ctl" style="margin-top:16px"><input id="code" type="password" autocomplete="off" placeholder="код"><button data-c="1">→</button></div></div>';return}
const acc=PEOPLE.find(p=>p.id===who).acc;document.documentElement.style.setProperty('--acc',acc);
document.getElementById('app').classList.toggle('wide',view==='table');
if(view==='hist'){renderHist();return}
if(view==='table'){renderTable();return}
const M=monthOf(S),{nd,cnt,full,hd,mp}=M,isFull=cnt>0&&mp===1,off=(new Date(vy,vm,1).getDay()+6)%7;
const mo=PEOPLE.map(p=>monthOf(P[p.id]));let both=0;
for(let d=1;d<=nd;d++){const k=key(vy,vm,d);if(PEOPLE.every(p=>pctOf(P[p.id],k)===1))both++}
const order=who===PEOPLE[0].id?[1,0]:[0,1];
const twin=`<svg class="twin" viewBox="0 0 320 170" role="img" aria-label="Прогресс месяца">${order.map(ix=>{const p=PEOPLE[ix],cx=ix?218:102,sel=p.id===who,col=(sel&&isFull)?'#f1b93a':p.acc;
return arc(cx,85,64,15,mo[ix].mp,col,sel?1:.55)+`<text x="${cx}" y="94" text-anchor="middle" class="rp" opacity="${sel?1:.6}">${Math.round(mo[ix].mp*100)}%</text>`}).join('')}</svg>`;
const who_=`<div class="who">${PEOPLE.map((p,ix)=>`<button class="${p.id===who?'on':''}" data-w="${p.id}" style="--pc:${p.acc};--pd:${p.deep}"><b>${p.n}</b><small>${mo[ix].full} дн. со 100%</small></button>`).join('')}</div>`;
let cal=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('')+'<div class="d e"></div>'.repeat(off);
for(let d=1;d<=nd;d++){const k=key(vy,vm,d),p=pctOf(S,k);
cal+=`<button class="d ${p===1?'full':''} ${(S.days[k]||[])[4]===1?'ty':''} ${k===sel?'sel':''} ${k===todayK()?'today':''}" style="--p:${Math.round((p||0)*100)}%" data-k="${k}"><span>${d}</span></button>`}
const sd=sel.split('-').map(Number),dt=new Date(sd[0],sd[1]-1,sd[2]),vals=S.days[sel]||[],dp=pctOf(S,sel);
const rows=H.map((h,i)=>{const v=vals[i],g=S.goals[i],p=v==null?0:Math.min(v/g,1),ok=v!=null&&v>=g;
return `<div class="h" style="--hc:var(--c${i})"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24">${ICONS[i]}</svg></span><div class="ht"><b>${h.n}</b><small>цель ${gfmt(i)} ${h.u}</small></div><span class="ok">${ok?'✓':''}</span></div>
<div class="bar"><i style="width:${p*100}%;background:var(--hc)"></i></div>
<div class="ctl"><button data-i="${i}" data-a="-1" aria-label="Меньше">−</button><input type="number" inputmode="decimal" step="any" min="0" placeholder="0" data-i="${i}" value="${v==null?'':v}" aria-label="${h.n}"><span>${h.u}</span><button data-i="${i}" data-a="1" aria-label="Больше">+</button></div></div>`}).join('')+typingTile();
const stats=H.map((h,i)=>{const p=cnt?hd[i]/cnt:0;return `<div class="stat"><span>${h.n.split(' ')[0]}</span><div class="bar" style="--hc:var(--c${i})"><i style="width:${p*100}%;background:var(--c${i})"></i></div><em>${Math.round(p*100)}%</em></div>`}).join('')+tyStat(M);
const goals=H.map((h,i)=>`<span>${h.n}, ${h.u}</span><input type="number" step="any" min="0" data-g="${i}" value="${S.goals[i]}">`).join('')+`<span>Учиться печатать, раз в неделю</span><input type="number" step="1" min="1" max="7" data-g="4" value="${wg(S)}">`;
document.getElementById('app').innerHTML=`
${tabs()}
<div class="top"><button class="nav" data-m="-1" aria-label="Предыдущий месяц">‹</button><h1>${MN[vm]} ${vy}</h1><button class="nav" data-m="1" aria-label="Следующий месяц">›</button></div>
<div class="hero">${twin}${who_}<div class="both">Заполнено дней: ${cnt} из ${nd}. Вместе <em>${both}</em> дн. со 100%${isFull?'. Все цели месяца выполнены ✓':''}</div></div>
<div class="card"><div class="cal">${cal}</div></div>
<div class="card"><div class="dayhead"><div><h2>${sd[2]} ${MG[sd[1]-1]}</h2><small>${WD[dt.getDay()]}, прогресс дня ${Math.round((dp||0)*100)}%${dp===1?' ✓':''}</small></div><div class="ringbox" style="width:52px;height:52px">${ring(dp||0,52,7,dp===1?'#f1b93a':acc)}</div></div>${rows}</div>
<div class="card"><span class="lbl" style="display:block;margin-bottom:14px">Выполнение за месяц</span><div class="stats">${stats}</div></div>
<button class="link" data-t="1">${showGoals?'Скрыть цели':'Изменить цели'}</button>${showGoals?`<div class="card"><span class="lbl">Цели на день: ${PEOPLE.find(p=>p.id===who).n}</span><div class="gl">${goals}</div></div>`:''}
<div class="sync">${syncMsg}</div><button class="link" data-x="1">Сменить код доступа</button>`}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.v){view=b.dataset.v;sheet=null;tblReset=true;render();window.scrollTo(0,0)}
else if(b.dataset.hk){who=b.dataset.hw;S=P[who];sel=b.dataset.hk;view='track';save();render();window.scrollTo(0,0)}
else if(b.dataset.ck){cellTap(b.dataset.ck,+b.dataset.ci)}
else if(b.dataset.md){mode=b.dataset.md;sheet=null;render()}
else if(b.dataset.sd){sheet=null;render()}
else if(b.dataset.sa&&sheet){const i=sheet.i,cur=(S.days[sheet.k]||[])[i]||0;setVal(sheet.k,i,Math.max(0,Math.round((cur+b.dataset.sa*H[i].s)*100)/100))}
else if(b.dataset.sg&&sheet){setVal(sheet.k,sheet.i,S.goals[sheet.i])}
else if(b.dataset.sc&&sheet){setVal(sheet.k,sheet.i,null)}
else if(b.dataset.c){const v=document.getElementById('code').value.trim();if(v){CODE=v;try{localStorage.setItem('habits-code',v)}catch(e){}remote=!!(CFG.url&&CFG.key);render();pull()}}
else if(b.dataset.x){try{localStorage.removeItem('habits-code')}catch(e){}CODE='';remote=false;render()}
else if(b.dataset.w){who=b.dataset.w;S=P[who];showGoals=false;save();render()}
else if(b.dataset.k){sel=b.dataset.k;render()}
else if(b.dataset.m){tblReset=true;vm+=+b.dataset.m;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}
sel=(vy===now.getFullYear()&&vm===now.getMonth())?key(vy,vm,now.getDate()):key(vy,vm,1);render()}
else if(b.dataset.a){const i=+b.dataset.i,cur=(S.days[sel]||[])[i]||0;setVal(sel,i,Math.max(0,Math.round((cur+b.dataset.a*H[i].s)*100)/100))}
else if(b.dataset.ty){setVal(sel,4,(S.days[sel]||[])[4]===1?null:1)}
else if(b.dataset.t){showGoals=!showGoals;render()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code'){const b=document.querySelector('[data-c]');if(b)b.click()}});
app.addEventListener('change',e=>{const t=e.target;
if(t.dataset.g!=null){const v=parseFloat(t.value);if(v>0){S.goals[+t.dataset.g]=v;save();render()}}
else if(t.dataset.si!=null&&sheet){const v=t.value===''?null:Math.max(0,parseFloat(t.value)||0);setVal(sheet.k,sheet.i,v)}
else if(t.dataset.i!=null){const v=t.value===''?null:Math.max(0,parseFloat(t.value)||0);setVal(sel,+t.dataset.i,v)}});
render();
pull();setInterval(pull,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
</html>
