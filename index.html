<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#6f9cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<title>Планер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fb;--card:#fff;--cell:#eceaf6;--track:#e4e1f1;--text:#2a2650;--mute:#857fa6;--gold:#fde7a6;--goldd:#f1b93a;--goldtxt:#7a5a10;--okc:#2f8f68;--c0:#7c9cf5;--c1:#b58cf0;--c2:#f5a56b;--c3:#4fc8b0;--c4:#5bb8f0;--c5:#e86f9a;--c6:#f0c24b;--c7:#8b7cf0;--acc:#6f9cf0;--shadow:0 10px 30px rgba(60,50,130,.10);--fd:"Unbounded","Manrope",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b1c;--card:#15142a;--cell:#1d1c38;--track:#2b2a50;--text:#eceafc;--mute:#9694c2;--gold:#5c4a1e;--goldtxt:#ffe3a0;--okc:#7fe0b6;--shadow:0 0 0 1px rgba(255,255,255,.05),0 14px 36px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0c0b1c;--card:#15142a;--cell:#1d1c38;--track:#2b2a50;--text:#eceafc;--mute:#9694c2;--gold:#5c4a1e;--goldtxt:#ffe3a0;--okc:#7fe0b6;--shadow:0 0 0 1px rgba(255,255,255,.05),0 14px 36px rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;max-width:100vw;background:color-mix(in srgb,var(--acc) 10%,var(--bg));color:var(--text);font-family:"Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .5s;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 44px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:30px;padding:20px;box-shadow:var(--shadow)}
.lbl{font-size:13px;font-weight:700;color:var(--mute)}
.seg{display:flex;background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:99px;padding:4px}
.seg button{flex:1;height:36px;border-radius:99px;background:none;font-weight:700;font-size:14px;color:var(--mute);transition:all .25s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 10px rgba(60,50,130,.12)}
.top{display:flex;align-items:center;justify-content:space-between}
.top h1{font:600 16px var(--fd);margin:0;letter-spacing:-.01em}
.nav{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.hero{display:flex;flex-direction:column;gap:6px;align-items:center}
.twin{width:100%;max-width:340px;height:auto;display:block;overflow:visible}
.rp{font:600 22px var(--fd);fill:var(--text)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.who button{background:none;border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .25s}
.who button.on{background:var(--pd);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--pd) 35%,transparent)}
.who button.on small{color:rgba(255,255,255,.88)}
.who b{font:600 15px var(--fd)}
.who small{font-size:12px;color:var(--mute);font-weight:600}
.both{font-size:13px;color:var(--mute);font-weight:600;text-align:center}
.both em{font-style:normal;color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.dow{font-size:12px;color:var(--mute);text-align:center;font-weight:600;padding-bottom:4px}
.d{min-width:0;width:100%;aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;font-size:13px;font-weight:600;background:conic-gradient(var(--acc) var(--p,0%),var(--track) 0);transition:transform .15s}
.d::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card)}
.d span{position:relative}
.d:active{transform:scale(.92)}
.d.e{visibility:hidden}
.d.full{background:var(--goldd)}
.d.full::before{background:var(--gold)}
.d.full span{color:var(--goldtxt);font-weight:700}
.d.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.d.now span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dayhead h2{margin:0;font:600 20px var(--fd);letter-spacing:-.01em}
.dayhead small{color:var(--mute);display:block;margin-top:4px;font-size:13px;font-weight:600}
.ringbox{position:relative;flex:none}
.ringbox svg{display:block}
.ringbox b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 12px var(--fd)}
.h{background:color-mix(in srgb,var(--hc) 13%,var(--card));border-radius:24px;padding:14px;margin-bottom:10px}
.h:last-child{margin-bottom:0}
.hd{display:flex;align-items:center;gap:12px}
.ic{width:40px;height:40px;border-radius:14px;background:var(--hc);display:grid;place-items:center;color:#fff;flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ht{display:flex;flex-direction:column;gap:2px}
.ht b{font-size:15px}
.ht small{color:var(--mute);font-size:12px;font-weight:600}
.hd .ok{margin-left:auto;color:var(--okc);font-weight:800;font-size:18px}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--hc,var(--text)) 16%,var(--track));margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:42px;height:42px;border-radius:50%;background:var(--card);font-size:20px;box-shadow:0 2px 10px rgba(60,50,130,.12);transition:transform .12s}
.ctl button:active{transform:scale(.9)}
.ctl input,.gl input{flex:1;min-width:0;height:42px;border-radius:16px;border:0;background:var(--card);color:var(--text);text-align:center;font:600 16px var(--fd);outline-offset:2px}
.ctl span{color:var(--mute);font-size:12px;width:40px;font-weight:600}
.stats{display:flex;flex-direction:column;gap:12px;padding:0 4px}
.stat{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.stat span{width:84px}
.stat .bar{flex:1;margin:0}
.stat em{font-style:normal;width:40px;text-align:right;color:var(--mute)}
.link{background:none;color:var(--mute);font-size:13px;font-weight:600;padding:6px 0;text-align:center}
.gl{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;margin-top:12px;font-size:14px;font-weight:600}
.d.ty::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--c4)}
.wk{display:flex;gap:6px;margin:12px 0 0;justify-content:space-between}
.wk i{flex:1;max-width:38px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 11px "Manrope",sans-serif;font-style:normal;background:color-mix(in srgb,var(--hc) 16%,var(--track));color:var(--mute)}
.wk i.on{background:var(--hc);color:#fff}
.wk i.cur{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--hc)}
.tg{width:100%;height:46px;border-radius:16px;background:var(--card);font-weight:700;font-size:14px;margin-top:12px;box-shadow:0 2px 10px rgba(60,50,130,.12);transition:all .2s}
.tg.on{background:var(--hc);color:#fff}
.wkt{display:block;text-align:center;margin-top:8px;color:var(--mute);font-weight:600;font-size:12px}
.add{display:grid;grid-template-columns:1fr 1fr 84px;gap:8px;margin-top:18px}
.add input{min-width:0;height:42px;border-radius:14px;border:0;background:var(--cell);color:var(--text);padding:0 12px;font:600 14px "Manrope",sans-serif}
.add .addb,.del{grid-column:1/-1;height:44px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:14px}
.del{background:var(--cell);color:var(--mute);height:38px;margin-top:8px;width:100%;font-size:13px}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sb{background:var(--cell);border-radius:20px;padding:14px 6px;text-align:center}
.sb i{display:block;font-style:normal;font-size:12px;font-weight:800;margin-bottom:4px}
.sb b{font:600 26px var(--fd);display:block}
.sb span{font-size:12px;color:var(--mute);font-weight:600;display:block;margin-top:2px}
.wsm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wp{background:var(--cell);border-radius:20px;padding:14px;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}
.wp b{font:600 15px var(--fd)}
.wp i{font-style:normal;color:var(--mute)}
.wkn{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.wkn button{width:34px;height:34px;border-radius:50%;background:var(--cell);font-size:16px}
.ch{margin-top:16px}
.chh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px}
.chh small{color:var(--mute);font-weight:600;font-size:12px}
.ch svg{width:100%;height:56px;display:block}
.ach{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ach span{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--gold);color:var(--goldtxt);font-size:13px;font-weight:700}
.ach span.lock{background:var(--cell);color:var(--mute);opacity:.6;filter:grayscale(1)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#3a3570,#1c1842);color:#fff;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:190px;height:auto;overflow:visible;animation:flt 3s ease-in-out infinite}
#splash .tr{fill:none;stroke:#fff;stroke-opacity:.13;stroke-width:9}
#splash .pg{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3;animation:draw 1.2s cubic-bezier(.3,.7,.3,1) forwards}
#splash .dot{fill:#f5c75b;transform-origin:80px 10px;animation:pop .6s 1.1s cubic-bezier(.3,1.6,.5,1) both}
#splash h2{margin:0;font:600 26px var(--fd);letter-spacing:.04em;animation:rise .7s .5s both}
#splash .ld{width:120px;height:4px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;animation:rise .7s .9s both}
#splash .ld i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#7fa6f5,#f48fb4);animation:ld 1.1s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:var(--to)}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes flt{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.lovebtn{margin-top:8px;height:44px;padding:0 22px;border-radius:99px;background:color-mix(in srgb,#ea5a90 14%,var(--card));color:#d94a80;font-weight:700;font-size:14px;box-shadow:var(--shadow);transition:transform .15s}
.lovebtn:active{transform:scale(.95)}
.lovebtn.sent{background:#ea5a90;color:#fff}
.mcbtn{align-self:stretch;height:46px;padding:0 24px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px}
#love{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:60;display:flex;align-items:center;gap:14px;padding:14px 18px;border:0;border-radius:24px;text-align:left;color:#fff;background:linear-gradient(135deg,#ea5a90,#f48fb4);box-shadow:0 14px 36px rgba(234,90,144,.4);animation:drop .5s cubic-bezier(.3,1.4,.5,1)}
#love .hh{font-size:30px;animation:beat 1.2s ease-in-out infinite}
#love b{display:block;font:600 16px var(--fd)}
#love small{display:block;margin-top:3px;font-size:12px;font-weight:600;opacity:.85}
@keyframes drop{from{transform:translate(-50%,-90px);opacity:0}}
@keyframes beat{50%{transform:scale(1.25)}}
.mcbg{position:fixed;inset:0;z-index:70;background:rgba(20,16,50,.6);border-radius:0}
.mcb{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:94vh;overflow:auto;background:var(--card);border-radius:28px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mcb img{width:100%;border-radius:18px;display:block}
.mcb .row{display:flex;gap:8px;margin-top:12px}
.mcb .row button,.mcb .cls{flex:1;height:46px;border-radius:16px;font-weight:700;font-size:14px;background:var(--cell)}
.mcb .row .pri{background:#ea5a90;color:#fff}
.mcb .cls{width:100%;margin-top:8px;background:none;color:var(--mute)}
.seg.rest{margin-bottom:12px}
.seg.rest button{font-size:13px}
.dim{opacity:.42;transition:opacity .3s}
.d.rest::before{background:color-mix(in srgb,var(--c4) 20%,var(--card))}
.ri{position:absolute;top:0;right:-1px;font-size:11px;font-style:normal;line-height:1}
.sky{border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}
.sky svg{display:block;width:100%;height:auto}
.tw1{animation:tw 3.2s ease-in-out infinite}
.tw2{animation:tw 4.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.skyl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skyl span{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700}
.skyl i{width:10px;height:10px;border-radius:50%}
@media(prefers-reduced-motion:reduce){.tw1,.tw2{animation:none}}
.tabs button{font-size:12.5px;white-space:nowrap;padding:0 2px}
.wrbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:18px 20px;border-radius:26px;text-align:left;color:#fff;background:linear-gradient(135deg,#4b3fa8,#c0407a);box-shadow:var(--shadow);transition:transform .15s}
.wrbtn:active{transform:scale(.98)}
.wrbtn b{font:600 19px var(--fd)}
.wrbtn span{font-size:13px;font-weight:600;opacity:.85}
.wrbtn.alt2{background:linear-gradient(135deg,#d98a2b,#c0407a)}
.wrbtn.alt{background:linear-gradient(135deg,#1f6f8b,#4b3fa8)}
#wrap{position:fixed;inset:0;z-index:65;color:#fff;display:flex;flex-direction:column;transition:background .4s;user-select:none;-webkit-user-select:none}
.wr-bars{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;right:14px;display:flex;gap:4px;z-index:5}
.wr-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28)}
.wr-bars i.a{background:#fff}
.wr-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:14px;z-index:6;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:22px}
.wr-s{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:86px 26px 60px;gap:16px;animation:wrin .55s both}
@keyframes wrin{from{opacity:0;transform:translateY(18px)}}
.wr-prev,.wr-next{position:absolute;top:70px;bottom:0;background:none;z-index:2;border-radius:0}
.wr-prev{left:0;width:32%}
.wr-next{right:0;width:68%}
.wr-lbl{font-size:16px;font-weight:700;letter-spacing:.05em;opacity:.7}
.wr-big{font:600 52px/1.08 var(--fd)}
.wr-huge{font:600 76px/1 var(--fd)}
.wr-sub{font-size:16px;font-weight:600;opacity:.85}
.wr-ring{width:240px;height:auto;overflow:visible}
.wr-cols{display:flex;gap:22px;justify-content:center;width:100%}
.wr-col{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.wr-col b{font:600 56px/1.1 var(--fd)}
.wr-col b.m{font-size:36px}
.wr-col em{font-style:normal;font-size:14px;font-weight:700;opacity:.8;color:#fff}
.wr-col .nm{font:600 15px var(--fd);color:#fff;margin-top:4px}
.wr-tog{padding:12px 22px;border-radius:99px;background:rgba(245,199,91,.22);color:#ffe3a0;font-weight:700;font-size:15px}
.wr-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wr-s{position:relative;z-index:3;pointer-events:none}
.wr-s button{pointer-events:auto}
.wr-btn{height:50px;padding:0 24px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:15px}
.wr-btn.pri{background:#fff;color:#3a2a6e}
@media(prefers-reduced-motion:reduce){.wr-s{animation:none}}
.sec{background:linear-gradient(135deg,#ffe3a0,#f5c75b)!important;color:#6b4a00!important;box-shadow:0 4px 14px rgba(245,199,91,.45)}
#secret{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;z-index:62;padding:14px 18px;border:0;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(135deg,#4b3fa8,#c0407a);box-shadow:0 14px 36px rgba(75,63,168,.45);animation:rs .5s cubic-bezier(.3,1.4,.5,1)}
#secret b{display:block;font:600 14px var(--fd)}
#secret span{display:block;margin-top:4px;font-size:14px;font-weight:700}
@keyframes rs{from{transform:translate(-50%,90px);opacity:0}}
.mascot{display:flex;align-items:center;gap:12px}
.mc-heart{flex:none;width:104px;height:114px;background:none;padding:0}
.mc-heart svg{width:100%;height:100%;overflow:visible}
.mc-bubble{position:relative;flex:1;padding:12px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:700;line-height:1.35}
.mc-bubble::before{content:"";position:absolute;left:-6px;top:30px;width:14px;height:14px;background:var(--card);transform:rotate(45deg);border-radius:3px}
.mc-bubble small{display:block;color:var(--mute);font-size:11px;font-weight:700;margin-bottom:3px}
.hb-idle{animation:hfl 3.2s ease-in-out infinite}
.hb-happy{animation:hjump .75s ease-in-out infinite}
.hb-tap{animation:hjump .6s ease-in-out 2}
.hb-sleep{animation:hsl 4s ease-in-out infinite}
.hb-miss{animation:hsw 4.5s ease-in-out infinite}
.hz{animation:hz 2.4s ease-in-out infinite}
.hs{animation:tw 1.8s ease-in-out infinite}
@keyframes hfl{50%{transform:translateY(-4px)}}
@keyframes hjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes hsl{50%{transform:translateY(3px)}}
@keyframes hsw{50%{transform:translateX(3px)}}
@keyframes hz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.hb-idle,.hb-happy,.hb-tap,.hb-sleep,.hb-miss,.hz,.hs{animation:none}}
.fr{padding:16px}
.fr b{display:block;font:600 14px var(--fd);margin-bottom:12px}
.frc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frc div{background:var(--cell);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px}
.frc span{font-size:12px;font-weight:700}
.frc strong{font:600 22px var(--fd)}
.frc small{font-size:11px;color:var(--mute);font-weight:600}
.fr.frt{background:linear-gradient(135deg,#ffe9b0,#ffd9e6);color:#3a2a4a}
.fr.frt .frc div{background:rgba(255,255,255,.6)}
.fr.frt .frc small,.fr.frt .frc span{color:#6b5a78}
.add select{grid-column:1/-1;height:42px;border-radius:14px;border:0;background:var(--cell);color:var(--text);padding:0 12px;font:600 14px "Manrope",sans-serif}

const sd=sel.split('-').map(Number),dt=new Date(sd[0],sd[1]-1,sd[2]),vals=S.days[sel]||[],dp=pctOf(S,sel);
const rows=idxsOf(S).filter(i=>i!==30).map(i=>{const h=info(S,i),v=vals[i],g=h.g,p=v==null?0:Math.min(v/g,1),ok=v!=null&&v>=g;
return `<div class="h" style="--hc:var(--c${cc(i)})"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24">${ICONS[i]||ICONS[4]}</svg></span><div class="ht"><b>${h.n}</b><small>цель ${gfmt(i)} ${h.u}</small></div><span class="ok">${ok?'✓':''}</span></div>
<div class="bar"><i style="width:${p*100}%;background:var(--hc)"></i></div>
<div class="ctl"><button data-i="${i}" data-a="-1" aria-label="Меньше">−</button><input type="number" inputmode="decimal" step="any" min="0" placeholder="0" data-i="${i}" value="${v==null?'':v}" aria-label="${h.n}"><span>${h.u}</span><button data-i="${i}" data-a="1" aria-label="Больше">+</button></div></div>`}).join('')+prepTile()+typingTile();
const stats=idxsOf(S).map(i=>{const h=info(S,i),den=i===30?M.cntp:cnt,p=den?(hd[i]||0)/den:0;return `<div class="stat"><span>${h.n.split(' ')[0]}</span><div class="bar" style="--hc:var(--c${cc(i)})"><i style="width:${p*100}%;background:var(--c${cc(i)})"></i></div><em>${Math.round(p*100)}%</em></div>`}).join('')+tyStat(M);

document.getElementById('app').innerHTML=`
${tabs()}
<div class="top"><button class="nav" data-m="-1" aria-label="Предыдущий месяц">‹</button><h1>${MN[vm]} ${vy}</h1><button class="nav" data-m="1" aria-label="Следующий месяц">›</button></div>
${todayCard()}<div class="hero">${twin}${who_}<div class="both">Заполнено дней: ${cnt} из ${nd}. Вместе <em>${both}</em> дн. со 100%${isFull?'. Все цели месяца выполнены ✓':''}</div>${loveBtn()}</div>
<div class="card"><div class="cal">${cal}</div></div>
<div class="card"><div class="dayhead"><div><h2>${sd[2]} ${MG[sd[1]-1]}</h2><small>${WD[dt.getDay()]}, ${vals[40]?(vals[40]==='sick'?'болею, день не считается':'выходной, день не считается'):'прогресс дня '+Math.round((dp||0)*100)+'%'+(dp===1?' ✓':'')}</small></div><div class="ringbox${popDay?' pop':''}" style="width:52px;height:52px">${ring(dp||0,52,7,dp===1?'#f1b93a':acc)}</div></div>${restBar()}<div class="${vals[40]?'dim':''}">${rows}</div></div>
<div class="card"><span class="lbl" style="display:block;margin-bottom:14px">Выполнение за месяц</span><div class="stats">${stats}</div></div>
<div class="sync">${syncMsg}</div>`}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const stp=e.target.closest('[data-star]');if(stp){showDay(stp.dataset.star);return}if(e.target.closest('.sky')){const t=Date.now();skyTaps=(t-skyLast<1500)?skyTaps+1:1;skyLast=t;if(skyTaps>=5){skyTaps=0;egg('star')}return}const b=e.target.closest('button');if(!b)return;
if(b.dataset.v){view=b.dataset.v;enter();render();window.scrollTo(0,0)}
else if(b.dataset.hk){who=b.dataset.hw;S=P[who];sel=b.dataset.hk;view='track';save();render();window.scrollTo(0,0)}
else if(b.dataset.c){const v=document.getElementById('code').value.trim();if(v){CODE=v;try{localStorage.setItem('habits-code',v)}catch(e){}remote=!!(CFG.url&&CFG.key);render();pull()}}
else if(b.dataset.x){try{localStorage.removeItem('habits-code')}catch(e){}CODE='';remote=false;render()}
else if(b.dataset.w){who=b.dataset.w;S=P[who];showGoals=false;const l=document.getElementById('love');if(l)l.remove();save();render();pullLove()}
else if(b.dataset.love){sendLove(b)}
else if(b.dataset.sz){UI.sz=+b.dataset.sz;saveUI();render()}
else if(b.dataset.diag){if(b.dataset.diag==='sync'){setSync('Проверяю…');pull().then(()=>{if(view==='set')render()})}else{(async()=>{try{const rs=await navigator.serviceWorker.getRegistrations();rs.forEach(r=>r.unregister());const ks=await caches.keys();ks.forEach(k=>caches.delete(k))}catch(e){}location.reload()})()}}
else if(b.dataset.ui){UI[b.dataset.ui]=UI[b.dataset.ui]?0:1;saveUI();render()}
else if(b.dataset.quiet){const q=!UI.vib&&!UI.conf&&!UI.anim;UI.vib=UI.conf=UI.anim=q?1:0;saveUI();render()}
else if(b.dataset.pal){S.theme=b.dataset.pal;save();applyTheme();render()}
else if(b.dataset.tc){const i=b.dataset.tc==='ty'?4:+b.dataset.tc,k=todayK(),cur=(S.days[k]||[])[i];if(i===30&&schedOn(S))showPrep();else if(i===4||i===30)setVal(k,i,cur===1?null:1);else{const g=info(S,i).g;setVal(k,i,(cur!=null&&cur>=g)?null:g)}}
else if(b.dataset.rdy){toggleReady(b.dataset.rk,+b.dataset.rdy)}
else if(b.dataset.addsch){const n=document.getElementById('sn').value.trim();if(n){S.sched=S.sched||[];S.sched.push({id:Date.now(),d:+document.getElementById('sd').value,t:document.getElementById('st').value,n});save();render()}}
else if(b.dataset.delsch){S.sched=(S.sched||[]).filter(c=>c.id!==+b.dataset.delsch);save();render()}
else if(b.dataset.heart){if(heartHeld){heartHeld=false;return}const t=Date.now();heartTaps=(t-heartLast<1800)?heartTaps+1:1;heartLast=t;if(heartTaps>=7){heartTaps=0;egg('rain')}else{heartN++;heartTap=true;render()}}
else if(b.dataset.adddate){const n=document.getElementById('dn').value.trim(),v=document.getElementById('dd').value,t=document.getElementById('dt').value;if(n&&v){const a=v.split('-').map(Number);S.dates=S.dates||[];S.dates.push({id:Date.now(),n,m:a[1],d:a[2],t});save();render()}}
else if(b.dataset.deldate){S.dates=(S.dates||[]).filter(x=>x.id!==+b.dataset.deldate);save();render()}
else if(b.dataset.mc){showCard()}
else if(b.dataset.sky){showCard(skyCard)}
else if(b.dataset.wrap){openWrap(b.dataset.wrap)}
else if(b.dataset.k){sel=b.dataset.k;render()}
else if(b.dataset.m){enter();vm+=+b.dataset.m;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}
sel=(vy===now.getFullYear()&&vm===now.getMonth())?key(vy,vm,now.getDate()):key(vy,vm,1);render()}
else if(b.dataset.a){const i=+b.dataset.i,cur=(S.days[sel]||[])[i]||0;setVal(sel,i,Math.max(0,Math.round((cur+b.dataset.a*info(S,i).s)*100)/100))}
else if(b.dataset.wk){const a=sel.split('-').map(Number),x=new Date(a[0],a[1]-1,a[2]+ +b.dataset.wk);vy=x.getFullYear();vm=x.getMonth();sel=key(vy,vm,x.getDate());render()}
else if(b.dataset.add){const n=document.getElementById('cn').value.trim(),u=document.getElementById('cu').value.trim()||'раз',g=parseFloat(document.getElementById('cg').value);if(n&&g>0){S.custom.push({id:S.nid++,n,u,g});save();render()}}
else if(b.dataset.del){const id=+b.dataset.del;if(confirm('Удалить привычку? Записи по ней перестанут учитываться.')){S.custom=S.custom.filter(c=>c.id!==id);save();render()}}
else if(b.dataset.rest){const v=b.dataset.rest;setVal(sel,40,v==='none'?null:v)}
else if(b.dataset.pr){setVal(sel,30,(S.days[sel]||[])[30]===1?null:1)}
else if(b.dataset.ty){setVal(sel,4,(S.days[sel]||[])[4]===1?null:1)}
else if(b.dataset.t){showGoals=!showGoals;render()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code'){const b=document.querySelector('[data-c]');if(b)b.click()}});
app.addEventListener('change',e=>{const t=e.target;
if(t.dataset.g!=null){const v=parseFloat(t.value);if(v>0){S.goals[+t.dataset.g]=v;save();render()}}
else if(t.dataset.cg!=null){const v=parseFloat(t.value),c=S.custom.find(x=>x.id===+t.dataset.cg);if(c&&v>0){c.g=v;save();render()}}
else if(t.dataset.i!=null){const v=t.value===''?null:Math.max(0,parseFloat(t.value)||0);setVal(sel,+t.dataset.i,v)}});
render();
checkSecrets(true);
addEventListener('online',()=>pull());addEventListener('offline',()=>setSync('Нет связи: записи сохраняются на устройстве'));
if(!navigator.onLine)setSync('Нет связи: записи сохраняются на устройстве');
(()=>{const q=new URLSearchParams(location.search).get('a');if(!q)return;try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
if(!CODE)return;
if(q==='prep'){sel=todayK();view='track';if((S.days[sel]||[])[30]!==1)setVal(sel,30,1);else render();toast('<b>Подготовка к парам</b><span>Отмечено на сегодня ✓</span>')}
else if(q==='sky'){view='sky';render()}})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const t0=Date.now(),first=pull();setInterval(pull,30000);
Promise.race([first,new Promise(r=>setTimeout(r,4000))]).catch(()=>{}).then(()=>setTimeout(()=>{const e=document.getElementById('splash');if(e){e.classList.add('out');setTimeout(()=>e.remove(),700)}},Math.max(0,1500-(Date.now()-t0))));document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
</html>
