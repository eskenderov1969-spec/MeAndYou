<script>
const H=[{n:'Английский язык',u:'ч',g:1.5,s:.5},{n:'Чтение книги',u:'ч',g:1,s:.5},{n:'Ходьба',u:'шагов',g:8000,s:1000},{n:'Сон (минимум)',u:'ч',g:7,s:.5}];

let P={emir:fresh(),saida:fresh()},who='emir',S,showGoals=false,view='track',syncMsg='Подключение…',refs=null;
try{const t=JSON.parse(localStorage.getItem(LS));if(t){for(const p of PEOPLE)if(t.P&&t.P[p.id]&&t.P[p.id].days)P[p.id]={goals:t.P[p.id].goals||P[p.id].goals,days:t.P[p.id].days,custom:t.P[p.id].custom||[],nid:t.P[p.id].nid||0};if(t.who&&P[t.who])who=t.who}}catch(e){}

function pctOf(D,k){const v=D.days[k]||[],ix=idxsOf(D).filter(i=>i!==30||k>=PREP_FROM);if(!ix.some(i=>v[i]!=null))return null;return ix.filter(i=>v[i]!=null&&v[i]>=info(D,i).g).length/ix.length}
function monthOf(D){const nd=new Date(vy,vm+1,0).getDate();let sum=0,cnt=0,full=0,ty=0,cntp=0;const hd={},ix=idxsOf(D);
for(let d=1;d<=nd;d++){const k=key(vy,vm,d),p=pctOf(D,k);if((D.days[k]||[])[4]===1)ty++;if(p!=null){sum+=p;cnt++;if(k>=PREP_FROM)cntp++;if(p===1)full++;ix.forEach(i=>{if(i===30&&k<PREP_FROM)return;const x=D.days[k][i];if(x!=null&&x>=info(D,i).g)hd[i]=(hd[i]||0)+1})}}

return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>${p>0?`<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,1)} ${c}" transform="rotate(-90 ${m} ${m})"/>`:''}</svg>`}
const CFG={url:'https://qffmezdmqmsvunmnzowl.supabase.co',key:'sb_publishable_vovS9yfPQIOAs1xRpLWcRg_rhQgFeMC'};
try{const h=decodeURIComponent(location.hash.slice(1));if(h){localStorage.setItem('habits-code',h);history.replaceState(null,'',location.pathname+location.search)}}catch(e){}

for(let d=1;d<=nd;d++){const k=key(vy,vm,d);if(PEOPLE.every(p=>pctOf(P[p.id],k)===1))both++}
const order=who===PEOPLE[0].id?[1,0]:[0,1];
const twin=`<svg class="twin" viewBox="0 0 320 170" role="img" aria-label="Прогресс месяца">${order.map(ix=>{const p=PEOPLE[ix],cx=ix?218:102,sel=p.id===who,col=(sel&&isFull)?'#f1b93a':p.acc;
return arc(cx,85,64,15,mo[ix].mp,col,sel?1:.55)+`<text x="${cx}" y="94" text-anchor="middle" class="rp" opacity="${sel?1:.6}">${Math.round(mo[ix].mp*100)}%</text>`}).join('')}</svg>`;
const who_=`<div class="who">${PEOPLE.map((p,ix)=>`<button class="${p.id===who?'on':''}" data-w="${p.id}" style="--pc:${p.acc};--pd:${p.deep}"><b>${p.n}</b><small>${mo[ix].full} дн. со 100%</small></button>`).join('')}</div>`;
let cal=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('')+'<div class="d e"></div>'.repeat(off);
for(let d=1;d<=nd;d++){const k=key(vy,vm,d),p=pctOf(S,k);
cal+=`<button class="d ${p===1?'full':''} ${(S.days[k]||[])[4]===1?'ty':''} ${k===sel?'sel':''} ${k===todayK()?'today':''}" style="--p:${Math.round((p||0)*100)}%" data-k="${k}"><span>${d}</span></button>`}
const sd=sel.split('-').map(Number),dt=new Date(sd[0],sd[1]-1,sd[2]),vals=S.days[sel]||[],dp=pctOf(S,sel);
const rows=idxsOf(S).filter(i=>i!==30).map(i=>{const h=info(S,i),v=vals[i],g=h.g,p=v==null?0:Math.min(v/g,1),ok=v!=null&&v>=g;
return `<div class="h" style="--hc:var(--c${cc(i)})"><div class="hd"><span class="ic"><svg viewBox="0 0 24 24">${ICONS[i]||ICONS[4]}</svg></span><div class="ht"><b>${h.n}</b><small>цель ${gfmt(i)} ${h.u}</small></div><span class="ok">${ok?'✓':''}</span></div>
<div class="bar"><i style="width:${p*100}%;background:var(--hc)"></i></div>
<div class="ctl"><button data-i="${i}" data-a="-1" aria-label="Меньше">−</button><input type="number" inputmode="decimal" step="any" min="0" placeholder="0" data-i="${i}" value="${v==null?'':v}" aria-label="${h.n}"><span>${h.u}</span><button data-i="${i}" data-a="1" aria-label="Больше">+</button></div></div>`}).join('')+prepTile()+typingTile();
const stats=idxsOf(S).map(i=>{const h=info(S,i),den=i===30?M.cntp:cnt,p=den?(hd[i]||0)/den:0;return `<div class="stat"><span>${h.n.split(' ')[0]}</span><div class="bar" style="--hc:var(--c${cc(i)})"><i style="width:${p*100}%;background:var(--c${cc(i)})"></i></div><em>${Math.round(p*100)}%</em></div>`}).join('')+tyStat(M);
const goals=H.map((h,i)=>`<span>${h.n}, ${h.u}</span><input type="number" step="any" min="0" data-g="${i}" value="${S.goals[i]}">`).join('')+`<span>Учиться печатать, раз в неделю</span><input type="number" step="1" min="1" max="7" data-g="4" value="${wg(S)}">`+S.custom.map(c=>`<span>${esc(c.n)}, ${esc(c.u)}</span><input type="number" step="any" min="0" data-cg="${c.id}" value="${c.g}">`).join('');
const addForm=`<div class="add"><input id="cn" placeholder="Название" maxlength="30"><input id="cu" placeholder="Единица" maxlength="10"><input id="cg" type="number" min="0" step="any" placeholder="Цель"><button class="addb" data-add="1">Добавить привычку</button>${S.custom.map(c=>`<button class="del" data-del="${c.id}">Удалить «${esc(c.n)}»</button>`).join('')}</div>`;
document.getElementById('app').innerHTML=`
${tabs()}
<div class="top"><button class="nav" data-m="-1" aria-label="Предыдущий месяц">‹</button><h1>${MN[vm]} ${vy}</h1><button class="nav" data-m="1" aria-label="Следующий месяц">›</button></div>
<div class="hero">${twin}${who_}<div class="both">Заполнено дней: ${cnt} из ${nd}. Вместе <em>${both}</em> дн. со 100%${isFull?'. Все цели месяца выполнены ✓':''}</div>${loveBtn()}</div>
<div class="card"><div class="cal">${cal}</div></div>
<div class="card"><div class="dayhead"><div><h2>${sd[2]} ${MG[sd[1]-1]}</h2><small>${WD[dt.getDay()]}, прогресс дня ${Math.round((dp||0)*100)}%${dp===1?' ✓':''}</small></div><div class="ringbox" style="width:52px;height:52px">${ring(dp||0,52,7,dp===1?'#f1b93a':acc)}</div></div>${rows}</div>
<div class="card"><span class="lbl" style="display:block;margin-bottom:14px">Выполнение за месяц</span><div class="stats">${stats}</div></div>
<button class="link" data-t="1">${showGoals?'Скрыть цели':'Изменить цели'}</button>${showGoals?`<div class="card"><span class="lbl">Цели на день: ${PEOPLE.find(p=>p.id===who).n}</span><div class="gl">${goals}</div>${addForm}</div>`:''}
<div class="sync">${syncMsg}</div><button class="link" data-x="1">Сменить код доступа</button>`}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.v){view=b.dataset.v;render();window.scrollTo(0,0)}
else if(b.dataset.hk){who=b.dataset.hw;S=P[who];sel=b.dataset.hk;view='track';save();render();window.scrollTo(0,0)}
else if(b.dataset.c){const v=document.getElementById('code').value.trim();if(v){CODE=v;try{localStorage.setItem('habits-code',v)}catch(e){}remote=!!(CFG.url&&CFG.key);render();pull()}}
else if(b.dataset.x){try{localStorage.removeItem('habits-code')}catch(e){}CODE='';remote=false;render()}
else if(b.dataset.w){who=b.dataset.w;S=P[who];showGoals=false;const l=document.getElementById('love');if(l)l.remove();save();render();pullLove()}
else if(b.dataset.love){sendLove(b)}
else if(b.dataset.mc){showCard()}
else if(b.dataset.k){sel=b.dataset.k;render()}
else if(b.dataset.m){vm+=+b.dataset.m;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}
sel=(vy===now.getFullYear()&&vm===now.getMonth())?key(vy,vm,now.getDate()):key(vy,vm,1);render()}
else if(b.dataset.a){const i=+b.dataset.i,cur=(S.days[sel]||[])[i]||0;setVal(sel,i,Math.max(0,Math.round((cur+b.dataset.a*info(S,i).s)*100)/100))}
else if(b.dataset.wk){const a=sel.split('-').map(Number),x=new Date(a[0],a[1]-1,a[2]+ +b.dataset.wk);vy=x.getFullYear();vm=x.getMonth();sel=key(vy,vm,x.getDate());render()}
else if(b.dataset.add){const n=document.getElementById('cn').value.trim(),u=document.getElementById('cu').value.trim()||'раз',g=parseFloat(document.getElementById('cg').value);if(n&&g>0){S.custom.push({id:S.nid++,n,u,g});save();render()}}
else if(b.dataset.del){const id=+b.dataset.del;if(confirm('Удалить привычку? Записи по ней перестанут учитываться.')){S.custom=S.custom.filter(c=>c.id!==id);save();render()}}
else if(b.dataset.pr){setVal(sel,30,(S.days[sel]||[])[30]===1?null:1)}
else if(b.dataset.ty){setVal(sel,4,(S.days[sel]||[])[4]===1?null:1)}
else if(b.dataset.t){showGoals=!showGoals;render()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code'){const b=document.querySelector('[data-c]');if(b)b.click()}});
app.addEventListener('change',e=>{const t=e.target;
if(t.dataset.g!=null){const v=parseFloat(t.value);if(v>0){S.goals[+t.dataset.g]=v;save();render()}}
else if(t.dataset.cg!=null){const v=parseFloat(t.value),c=S.custom.find(x=>x.id===+t.dataset.cg);if(c&&v>0){c.g=v;save();render()}}
else if(t.dataset.i!=null){const v=t.value===''?null:Math.max(0,parseFloat(t.value)||0);setVal(sel,+t.dataset.i,v)}});
render();
const t0=Date.now(),first=pull();setInterval(pull,30000);
Promise.race([first,new Promise(r=>setTimeout(r,4000))]).catch(()=>{}).then(()=>setTimeout(()=>{const e=document.getElementById('splash');if(e){e.classList.add('out');setTimeout(()=>e.remove(),700)}},Math.max(0,1500-(Date.now()-t0))));document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
</html>
